name: seam-tests

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '0 6 * * 1' # weekly drift check against upstream baseline
  workflow_dispatch: # lets the suite be run on a work branch before a PR

# These jobs run repository-controlled code (tests, scripts): read-only
# token, and no credentials left in the checkout for that code to find.
permissions:
  contents: read

jobs:
  seams:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22 # package.json engines: >=22
      # Baselines are gitignored locally (multi-GB); CI clones the pin:
      # upstream verified-at commit. This repo is fork-independent: no
      # donor checkout exists anywhere in test or build paths.
      - name: Clone pinned upstream baseline
        run: |
          git clone --no-checkout https://github.com/4ian/GDevelop review/GDevelop
          git -C review/GDevelop checkout 8301cdcaa48b496f48a28a6e3a56fa833eaeddff
      - name: Run full suite (seams + patcher + launcher + tier-2 + web)
        run: npm test
      - name: Patcher gate (seams + patch inventory)
        run: node scripts/apply-patches.mjs --check
